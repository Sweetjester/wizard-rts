  prompt: >
    a large bleached antler rack half-buried upright in the dark ground like a strange marker, distinct silhouette from other bone decor variants, stylized vampiric dark fantasy RTS terrain prop, Darkest-Dungeon-2-like painterly inked rendering, bold black ink outline, strong readable silhouette, matte materials, orthographic top-down game asset reference, high contrast shadows, no photorealism
