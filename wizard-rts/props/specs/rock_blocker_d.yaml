prop_id: rock_blocker_d
display_name: Rock Blocker (Flat Slab)
category: ROCK_BLOCKER
biome: dark_forest_frontier_v2
role: blocker

visual:
  style: darkest_dungeon_2_like_painterly_npr
  style_profile: tools/prop_pipeline/style_profiles/dark_forest_frontier_v2_props.json
  material: stone
  prompt: >
    a wide flat-topped dark grey-green rock slab with cracked surface and faint moss, low and broad rather than tall, distinct silhouette from other rock blocker variants, stylized vampiric dark fantasy RTS terrain prop, Darkest-Dungeon-2-like painterly inked rendering, bold black ink outline, strong readable silhouette, matte stone surface, orthographic top-down game asset reference, high contrast shadows, no photorealism
  negative_prompt: >
    photorealistic, glossy plastic, noisy AI texture, tiny surface detail, soft low-contrast silhouette, desaturated dead colors, magenta, pink, purple, bright cheerful colors, modern materials, sci-fi, UI, text, watermark, realistic photo-scan look
  colors:
    palette: weathered dark grey-green stone, faint moss
  outline: true
  design_intent: >
    Throughput/volume pass (2026-08-16) so this category stops repeating a single mesh
    across the map. Explicit material override to avoid silent fallback-to-stone.

model:
  generator: trellis2
  source: text_to_3d
  target_polycount: 8000
  scale_meters: 0.85
  footprint_note: 1x1 gameplay tile, small/tall rock tier per ASSET_SCALE_GUIDE.md
  export: glb

placement:
  pivot: tile_center_at_ground
  height_offset: 0.0
