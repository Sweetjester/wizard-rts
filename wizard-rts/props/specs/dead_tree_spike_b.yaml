prop_id: dead_tree_spike_b
display_name: Dead Tree Spike (Variant B)
category: DEAD_TREE_SPIKE
biome: dark_forest_frontier_v2
role: blocker

visual:
  style: darkest_dungeon_2_like_painterly_npr
  style_profile: tools/prop_pipeline/style_profiles/dark_forest_frontier_v2_props.json
  prompt: >
    A single leafless dead tree with sharp broken branch spikes, gaunt black silhouette,
    leaning slightly off-vertical, stylized dark fantasy RTS terrain prop,
    Darkest-Dungeon-2-like painterly inked rendering, strong black silhouette, matte bark
    material, orthographic top-down game asset reference, high contrast shadows, no
    photorealism
  negative_prompt: >
    photorealistic, glossy plastic, noisy AI texture, tiny surface detail, bright cheerful
    colors, modern materials, UI, text, watermark, leaves, foliage
  colors:
    bark: near-black dry dead wood
    accent: none — silhouette-only filler tree
  outline: true
  design_intent: >
    Second DEAD_TREE_SPIKE variant for map-generation variety (Terrain_Props_Roadmap.md
    step 4). Needs a visibly different lean/branch pattern from the existing variant so two
    placed side by side don't read as copies.

model:
  generator: meshy
  source: text_to_3d
  target_polycount: 9000
  scale_meters: 2.2
  footprint_note: 1x1 gameplay tile, tree tier per ASSET_SCALE_GUIDE.md
  export: glb

placement:
  pivot: tile_center_at_ground
  height_offset: 0.0
