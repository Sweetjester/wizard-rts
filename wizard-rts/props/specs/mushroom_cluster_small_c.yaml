  style_profile: tools/prop_pipeline/style_profiles/dark_forest_frontier_v2_props.json
  material: accent_corrupted
  prompt: >
    a scattered handful of small blood-red vampiric mushrooms of uneven height poking through moss, low profile ground decor, distinct silhouette from other small-cluster variants, stylized vampiric dark fantasy RTS terrain prop, Darkest-Dungeon-2-like painterly inked rendering, bold black ink outline, strong readable silhouette, chunky shapes, matte materials, orthographic top-down game asset reference, high contrast shadows, no photorealism
