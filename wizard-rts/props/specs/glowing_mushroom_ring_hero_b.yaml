prop_id: glowing_mushroom_ring_hero_b
display_name: Glowing Mushroom Ring (Concept Hero B)
category: GLOWING_MUSHROOM_RING
biome: dark_forest_frontier_v2
role: decor
concept_art_path: art/concepts/dark_forest_frontier_v2/mushroom_ring_hero.png

visual:
  style: darkest_dungeon_2_like_painterly_npr
  style_profile: tools/prop_pipeline/style_profiles/dark_forest_frontier_v2_props.json
  prompt: >
    A cluster of tall blood-red mushroom caps ringed around a small glowing ember/soul-light
    source nested at a gnarled tree root, matching the supplied concept art. Chunky readable
    silhouette, dark painterly inked rendering, single controlled warm emissive glow at the
    center, no fine noisy detail.
  negative_prompt: >
    photorealistic, glossy plastic, noisy AI texture, tiny surface detail, bright cheerful
    colors, modern materials, UI, text, watermark, excessive bloom
  colors:
    caps: blood red mushroom caps
    accent: warm ember/soul-light glow at the ring's center (hostile/mystery-coded, not KON cyan)
  outline: true
  design_intent: >
    Hero landmark decor generated from real concept art (Track 1). GLOWING_MUSHROOM_RING
    previously had a single procedural variant; this adds a distinctive, up-close-readable
    second option for content-plot dressing and map landmark variety.

model:
  generator: meshy
  source: image_to_3d
  target_polycount: 14000
  scale_meters: 1.5
  footprint_note: 1x1 gameplay tile, mushroom-cluster tier per ASSET_SCALE_GUIDE.md (1.4-2.6m)
  export: glb

placement:
  pivot: tile_center_at_ground
  height_offset: 0.0
