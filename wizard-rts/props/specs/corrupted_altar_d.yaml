prop_id: corrupted_altar_d
display_name: Corrupted Altar (Variant D)
category: CORRUPTED_ALTAR
biome: dark_forest_frontier_v2
role: landmark

visual:
  style: darkest_dungeon_2_like_painterly_npr
  style_profile: tools/prop_pipeline/style_profiles/dark_forest_frontier_v2_props.json
  material: accent_corrupted
  prompt: >
    a dark stone ritual altar dripping with blood-red corruption and thin glowing red veins, a hostile landmark centerpiece, distinct silhouette from the first altar variant, stylized vampiric dark fantasy RTS terrain prop, Darkest-Dungeon-2-like painterly inked rendering, bold black ink outline, strong readable silhouette, matte materials, orthographic top-down game asset reference, high contrast shadows, no photorealism
  negative_prompt: >
    photorealistic, glossy plastic, noisy AI texture, tiny surface detail, soft low-contrast silhouette, desaturated dead colors, magenta, pink, purple, bright cheerful colors, modern materials, sci-fi, UI, text, watermark, realistic photo-scan look
  colors:
    palette: near-black wet stone, blood red corruption veins and glow
  outline: true
  design_intent: >
    Throughput/volume pass (2026-08-16) so this category stops repeating a single mesh
    across the map. Explicit material override to avoid silent fallback-to-stone.

model:
  generator: trellis2
  source: text_to_3d
  target_polycount: 11000
  scale_meters: 1.4
  footprint_note: landmark-scale altar, matches corrupted_altar_c footprint per ASSET_SCALE_GUIDE.md
  export: glb

placement:
  pivot: tile_center_at_ground
  height_offset: 0.0
