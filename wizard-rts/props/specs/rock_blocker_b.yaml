prop_id: rock_blocker_b
display_name: Mossy Rock Blocker (Variant B)
category: ROCK_BLOCKER
biome: dark_forest_frontier_v2
role: blocker

visual:
  style: darkest_dungeon_2_like_painterly_npr
  style_profile: tools/prop_pipeline/style_profiles/dark_forest_frontier_v2_props.json
  prompt: >
    A single chunky dark grey-green boulder with moss growth and faint bone-white mineral
    streaks, distinct silhouette from a rounded weathered stack, stylized dark fantasy RTS
    terrain prop, Darkest-Dungeon-2-like painterly inked rendering, strong black silhouette,
    matte stone surface, orthographic top-down game asset reference, high contrast shadows,
    no photorealism
  negative_prompt: >
    photorealistic, glossy plastic, noisy AI texture, tiny surface detail, soft low-contrast
    silhouette, bright cheerful colors, modern materials, UI, text, watermark
  colors:
    stone: weathered dark grey-green
    accent: none — neutral terrain blocker, no emissive
  outline: true
  design_intent: >
    Second ROCK_BLOCKER variant so rocks stop repeating a single silhouette across the map
    (Terrain_Props_Roadmap.md step 4, variety pass on thin categories).

model:
  generator: meshy
  source: text_to_3d
  target_polycount: 8000
  scale_meters: 0.85
  footprint_note: 1x1 gameplay tile, small/tall rock tier per ASSET_SCALE_GUIDE.md
  export: glb

placement:
  pivot: tile_center_at_ground
  height_offset: 0.0
