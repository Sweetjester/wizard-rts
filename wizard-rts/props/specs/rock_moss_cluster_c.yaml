prop_id: rock_moss_cluster_c
display_name: Mossy Rock Cluster (Cluster of Three)
category: ROCK_MOSS_CLUSTER
biome: dark_forest_frontier_v2
role: decor

visual:
  style: darkest_dungeon_2_like_painterly_npr
  style_profile: tools/prop_pipeline/style_profiles/dark_forest_frontier_v2_props.json
  material: moss
  prompt: >
    a cluster of three small moss-covered boulders of varying size huddled together, vivid living green moss growth, distinct silhouette from other rock cluster variants, stylized vampiric dark fantasy RTS terrain prop, Darkest-Dungeon-2-like painterly inked rendering, bold black ink outline, strong readable silhouette, matte materials, orthographic top-down game asset reference, high contrast shadows, no photorealism
  negative_prompt: >
    photorealistic, glossy plastic, noisy AI texture, tiny surface detail, soft low-contrast silhouette, desaturated dead colors, magenta, pink, purple, bright cheerful colors, modern materials, sci-fi, UI, text, watermark, realistic photo-scan look
  colors:
    palette: dark stone, vivid living green moss
  outline: true
  design_intent: >
    Throughput/volume pass (2026-08-16) so this category stops repeating a single mesh
    across the map. Explicit material override to avoid silent fallback-to-stone.

model:
  generator: meshy
  source: text_to_3d
  target_polycount: 7000
  scale_meters: 0.8
  footprint_note: 1x1 gameplay tile, ground decor tier per ASSET_SCALE_GUIDE.md
  export: glb

placement:
  pivot: tile_center_at_ground
  height_offset: 0.0
