category: BROKEN_STONE_ARCH
biome: dark_forest_frontier_v2
role: landmark

visual:
  style: darkest_dungeon_2_like_painterly_npr
  style_profile: tools/prop_pipeline/style_profiles/dark_forest_frontier_v2_props.json
  material: stone
  prompt: >
    a broken stone archway where the keystone has fallen and lies at the base, moss creeping over both pieces, distinct silhouette from other arch variants, stylized vampiric dark fantasy RTS terrain prop, Darkest-Dungeon-2-like painterly inked rendering, bold black ink outline, strong readable silhouette, matte stone surface, orthographic top-down game asset reference, high contrast shadows, no photorealism
