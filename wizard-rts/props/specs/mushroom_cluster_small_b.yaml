prop_id: mushroom_cluster_small_b
display_name: Small Mushroom Cluster (Variant B)
category: MUSHROOM_CLUSTER_SMALL
biome: dark_forest_frontier_v2
role: decor

visual:
  style: darkest_dungeon_2_like_painterly_npr
  style_profile: tools/prop_pipeline/style_profiles/dark_forest_frontier_v2_props.json
  prompt: >
    A small cluster of three to five slender blood-red mushrooms of varying height growing
    from dark damp soil, subtle bioluminescent glow on the cap undersides, stylized dark
    fantasy RTS terrain prop, Darkest-Dungeon-2-like painterly inked rendering, strong black
    silhouette, matte materials, orthographic top-down game asset reference, no photorealism
  negative_prompt: >
    photorealistic, glossy plastic, noisy AI texture, tiny surface detail, bright cheerful
    colors, modern materials, UI, text, watermark, excessive bloom
  colors:
    caps: blood red to hot fungal red
    accent: faint magenta/red bioluminescence, no cyan
  outline: true
  design_intent: >
    Second MUSHROOM_CLUSTER_SMALL variant for map-generation variety (Terrain_Props_Roadmap.md
    step 4). Reads as ground decor, not a blocker — lower profile than MUSHROOM_BLOCKER.

model:
  generator: meshy
  source: text_to_3d
  target_polycount: 8000
  scale_meters: 0.9
  footprint_note: 1x1 gameplay tile, small mushroom decor tier per ASSET_SCALE_GUIDE.md
  export: glb

placement:
  pivot: tile_center_at_ground
  height_offset: 0.0
