prop_id: broken_stone_arch_d
display_name: Broken Stone Arch (Variant D)
category: BROKEN_STONE_ARCH
biome: dark_forest_frontier_v2
role: landmark

visual:
  style: darkest_dungeon_2_like_painterly_npr
  style_profile: tools/prop_pipeline/style_profiles/dark_forest_frontier_v2_props.json
  material: stone
  prompt: >
    a tall broken stone archway with one side collapsed, thick dark roots growing through the gap, distinct silhouette from the first arch variant, stylized vampiric dark fantasy RTS terrain prop, Darkest-Dungeon-2-like painterly inked rendering, bold black ink outline, strong readable silhouette, matte stone surface, orthographic top-down game asset reference, high contrast shadows, no photorealism
  negative_prompt: >
    photorealistic, glossy plastic, noisy AI texture, tiny surface detail, soft low-contrast silhouette, desaturated dead colors, magenta, pink, purple, bright cheerful colors, modern materials, sci-fi, UI, text, watermark, realistic photo-scan look
  colors:
    palette: near-black wet stone, faint moss, dark root veins
  outline: true
  design_intent: >
    Throughput/volume pass (2026-08-16) so this category stops repeating a single mesh
    across the map. Explicit material override to avoid silent fallback-to-stone.

model:
  generator: meshy
  source: text_to_3d
  target_polycount: 11000
  scale_meters: 1.6
  footprint_note: landmark-scale arch, matches broken_stone_arch_c footprint per ASSET_SCALE_GUIDE.md
  export: glb

placement:
  pivot: tile_center_at_ground
  height_offset: 0.0
