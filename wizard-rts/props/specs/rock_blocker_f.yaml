prop_id: rock_blocker_f
display_name: Rock Blocker (Balanced Boulder)
category: ROCK_BLOCKER
biome: dark_forest_frontier_v2
role: blocker

visual:
  style: darkest_dungeon_2_like_painterly_npr
  style_profile: tools/prop_pipeline/style_profiles/dark_forest_frontier_v2_props.json
  material: stone
  prompt: >
    a large boulder precariously balanced on a smaller rock, dark grey-green stone with faint moss, distinct silhouette from other rock blocker variants, stylized vampiric dark fantasy RTS terrain prop, Darkest-Dungeon-2-like painterly inked rendering, bold black ink outline, strong readable silhouette, matte stone surface, orthographic top-down game asset reference, high contrast shadows, no photorealism
  negative_prompt: >
    photorealistic, glossy plastic, noisy AI texture, tiny surface detail, soft low-contrast silhouette, desaturated dead colors, magenta, bright cheerful colors, modern materials, sci-fi, UI, text, watermark, realistic photo-scan look
  colors:
    palette: weathered dark grey-green stone, faint moss
  outline: true
  design_intent: >
    Throughput/volume pass (2026-08-16, wave 3, final). Prioritizes high-placement-frequency
    categories (blockers/decor instanced many times per map) over one-off landmarks, given
    limited remaining Meshy budget.

model:
  generator: trellis2
  source: text_to_3d
  target_polycount: 8000
  scale_meters: 1.0
  footprint_note: 1x1 gameplay tile, small/tall rock tier per ASSET_SCALE_GUIDE.md
  export: glb

placement:
  pivot: tile_center_at_ground
  height_offset: 0.0
