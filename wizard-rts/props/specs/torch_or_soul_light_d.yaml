prop_id: torch_or_soul_light_d
display_name: Torch or Soul Light (Floating Wisp)
category: TORCH_OR_SOUL_LIGHT
biome: dark_forest_frontier_v2
role: decor

visual:
  style: darkest_dungeon_2_like_painterly_npr
  style_profile: tools/prop_pipeline/style_profiles/dark_forest_frontier_v2_props.json
  material: accent_hostile
  prompt: >
    three separate small teardrop-shaped ember-red will-o-the-wisp flames of different heights,
    each one a thin wispy flame silhouette floating just above a tiny dark stone at its base,
    open negative space between the three wisps, no solid rock mass, no torch pole, no
    physical structure connecting them, distinct silhouette from a torch variant, stylized
    vampiric dark fantasy RTS terrain prop, Darkest-Dungeon-2-like painterly inked rendering,
    bold black ink outline, strong readable silhouette, matte materials, orthographic
    top-down game asset reference, high contrast shadows, no photorealism
  negative_prompt: >
    photorealistic, glossy plastic, noisy AI texture, tiny surface detail, soft low-contrast silhouette, desaturated dead colors, magenta, pink, purple, bright cheerful colors, modern materials, sci-fi, UI, text, watermark, realistic photo-scan look, boulder, rock mound, single solid mass, torch pole, stake
  colors:
    palette: dark stone, ember red wisp glow
  outline: true
  design_intent: >
    Throughput/volume pass (2026-08-16) so this category stops repeating a single mesh
    across the map. Explicit material override to avoid silent fallback-to-stone.

model:
  generator: trellis2
  source: text_to_3d
  target_polycount: 6000
  scale_meters: 0.8
  footprint_note: 1x1 gameplay tile, light decor tier per ASSET_SCALE_GUIDE.md
  export: glb

placement:
