prop_id: ramp_mesh_d
display_name: Ramp Mesh D (Root Steps)
category: RAMP_MESH
biome: dark_forest_frontier_v2
role: terrain

visual:
  style: darkest_dungeon_2_like_painterly_npr
  style_profile: tools/prop_pipeline/style_profiles/dark_forest_frontier_v2_props.json
  material: wood_bark
  prompt: >
    a low cluster of gnarled root-and-wood steps and rubble sitting at the foot of a ramp,
    a small readable stepping-stone accent piece not a full slope, stylized vampiric dark
    fantasy RTS terrain prop, Darkest-Dungeon-2-like painterly inked rendering, bold black
    ink outline, strong readable silhouette, chunky shapes, matte materials, orthographic
    top-down game asset reference, high contrast shadows, no photorealism
  negative_prompt: >
    photorealistic, glossy plastic, noisy AI texture, tiny surface detail, soft low-contrast silhouette, desaturated dead colors, magenta, pink, purple, bright cheerful colors, modern materials, sci-fi, UI, text, watermark, realistic photo-scan look, tall diagonal ramp slab
  colors:
    palette: near-black wet wood/root, faint moss
  outline: true
  design_intent: >
    Volume/variety pass (2026-08-16). Reframed from the earlier ramp_mesh_c (a full slope
    mesh, never referenced by the renderer since _add_ramps() is 100% procedural) into a
    short base-of-ramp accent, now actually placed by _add_ramps() as a decorative overlay
    on top of the procedural slope mesh (map_3d_renderer.gd _add_ramps). Root-step variant.

model:
  generator: meshy
  source: text_to_3d
  target_polycount: 7000
  scale_meters: 0.9
  footprint_note: small accent placed at the low end of the procedural ramp, not a full slope
  export: glb

placement:
  pivot: tile_center_at_ground
  height_offset: 0.0
