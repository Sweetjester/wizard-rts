category: LANTERN_TREE_BLOCKER
biome: dark_forest_frontier_v2
role: blocker

visual:
  style: darkest_dungeon_2_like_painterly_npr
  style_profile: tools/prop_pipeline/style_profiles/dark_forest_frontier_v2_props.json
  material: accent_corrupted
  prompt: >
    a tall gnarled dark tree where the leaves have been replaced by dozens of smooth oval hanging lanterns of varying size dangling from thin stems off every branch, each lantern a clean rounded teardrop shape, strong silhouette contrast between the thin black branches and the plump rounded lanterns, stylized vampiric dark fantasy RTS terrain prop, Darkest-Dungeon-2-like painterly inked rendering, bold black ink outline, strong readable silhouette, chunky shapes, matte materials, orthographic top-down game asset reference, high contrast shadows, no photorealism
