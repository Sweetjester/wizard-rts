    photorealistic, glossy plastic, noisy AI texture, tiny surface detail, soft low-contrast silhouette, desaturated dead colors, magenta, bright cheerful colors, modern materials, sci-fi, UI, text, watermark, realistic photo-scan look
  colors:
    palette: near-black bark and branches, blood red glowing lantern pods
  outline: true
  design_intent: >
    First LANTERN_TREE_BLOCKER: a brand new prop category, trees whose leaves are lantern pods. Wired into map_3d_renderer.gd's tree placement roll (10% of tree-slot clusters) and CATEGORY_RUNTIME_FOLDER so it actually renders in-game, unlike the earlier RAMP_MESH mistake.

