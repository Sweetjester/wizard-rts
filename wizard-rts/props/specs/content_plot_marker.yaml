prop_id: content_plot_marker
display_name: Content Plot Marker
category: CONTENT_PLOT_MARKER
biome: dark_forest_frontier_v2
role: ground_marker

visual:
  style: darkest_dungeon_2_like_painterly_npr
  style_profile: tools/prop_pipeline/style_profiles/dark_forest_frontier_v2_props.json
  prompt: >
    A cracked circular ritual stone embedded in dark forest ground, broken at its edges with
    small corrupted mushroom growths sprouting from the fractures, stylized dark fantasy RTS
    game prop, Darkest-Dungeon-2-like painterly inked rendering, strong black silhouette, chunky
    readable shapes, matte cracked stone, a single controlled hot pink-magenta bioluminescent
    glow pulsing from the fracture lines and mushroom caps, mostly flat and low-profile so it
    reads as ground decoration not an obstacle, orthographic top-down game asset reference, high
    contrast shadows, no photorealism
  negative_prompt: >
    photorealistic, glossy plastic, noisy AI texture, tiny surface detail, tall or blocking
    geometry, cyan or blue glow, bright cheerful colors, modern materials, UI, text, watermark,
    realistic stone photo-scan look
  colors:
    stone: cracked dark grey stone, corrupted
    accent: hot pink-magenta glow (matches the biome's corrupted-mushroom accent language)
  outline: true
  design_intent: >
    Signals "something unknown is here — quest content, not combat, not your base" from RTS
    camera distance. Pink/magenta deliberately reuses the biome's established corrupted-mushroom
    accent color (see STYLE_BIBLE.md) rather than inventing a new one, so it reads as part of the
    world rather than a UI overlay. Must stay flat/flush — floor marker, never a blocker.

model:
  generator: trellis2
  source: text_to_3d
  target_polycount: 16000
  scale_meters: 2.2
  footprint_note: fits within a single gameplay tile per ASSET_SCALE_GUIDE.md content-plot marker sizing
  export: glb

placement:
  pivot: tile_center_at_top_surface
  height_offset: 0.02
