prop_id: ruined_shrine_c
display_name: Ruined Shrine C (New Pipeline)
category: RUINED_SHRINE
biome: dark_forest_frontier_v2
role: landmark

visual:
  style: darkest_dungeon_2_like_painterly_npr
  style_profile: tools/prop_pipeline/style_profiles/dark_forest_frontier_v2_props.json
  prompt: >
    a ruined shrine dais of cracked bone-stone overtaken by black roots and vivid living moss, a landmark-scale structure, stylized vampiric dark fantasy RTS terrain prop, Darkest-Dungeon-2-like
    painterly inked rendering, bold black ink outline, strong readable silhouette, chunky
    shapes, matte materials, orthographic top-down game asset reference, high contrast
    shadows, no photorealism
  negative_prompt: >
    photorealistic, glossy plastic, noisy AI texture, tiny surface detail, soft low-contrast silhouette, desaturated dead colors, magenta, pink, purple, bright cheerful colors, modern materials, sci-fi, UI, text, watermark, realistic photo-scan look
  colors:
    palette: old bone stone, near-black roots, vivid living moss
  outline: true
  design_intent: >
    First concept-driven/text-to-3d replacement for RUINED_SHRINE, previously 100% procedural
    (tools/blender/create_dark_forest_v2_assets.py output). Part of the 2026-08-12 full-coverage
    pass — see DARK_FOREST_FRONTIER_V2_ART_BIBLE.md.

model:
  generator: meshy
  source: text_to_3d
  target_polycount: 16000
  scale_meters: 2.2
  footprint_note: landmark tier, larger than a standard prop per ASSET_SCALE_GUIDE.md
  export: glb

placement:
  pivot: tile_center_at_top_surface
  height_offset: 0.0
