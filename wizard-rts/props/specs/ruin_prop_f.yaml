  prompt: >
    a small broken stone statue base, just the feet and plinth remaining, moss growing over it, distinct silhouette from other ruin variants, stylized vampiric dark fantasy RTS terrain prop, Darkest-Dungeon-2-like painterly inked rendering, bold black ink outline, strong readable silhouette, matte stone surface, orthographic top-down game asset reference, high contrast shadows, no photorealism
