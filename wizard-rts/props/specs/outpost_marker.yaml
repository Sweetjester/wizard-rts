prop_id: outpost_marker
display_name: Outpost Marker
category: OUTPOST_MARKER
biome: dark_forest_frontier_v2
role: ground_marker

visual:
  style: darkest_dungeon_2_like_painterly_npr
  style_profile: tools/prop_pipeline/style_profiles/dark_forest_frontier_v2_props.json
  prompt: >
    A crude ring of sharpened bone stakes and dark iron driven into the forest floor marking
    hostile territory, stylized dark fantasy RTS game prop, Darkest-Dungeon-2-like painterly
    inked rendering, strong black silhouette, chunky readable shapes, matte weathered bone and
    corroded dark iron, a single controlled dull blood-red emberglow at the base of the stakes,
    mostly flat and low-profile so it reads as ground decoration not an obstacle, orthographic
    top-down game asset reference, high contrast shadows, no photorealism
  negative_prompt: >
    photorealistic, glossy plastic, noisy AI texture, tiny surface detail, tall or blocking
    geometry, cyan or pink-magenta glow, bright cheerful colors, modern materials, UI, text,
    watermark, realistic bone photo-scan look
  colors:
    materials: weathered bone, corroded dark iron
    accent: dull blood-red emberglow (hostile-coded, distinct from KON cyan and content-marker pink)
  outline: true
  design_intent: >
    Signals "Deom Legion presence, expect a fight" from RTS camera distance — visually the most
    threatening of the three plot markers by design, using red instead of the marker-cyan
    (player) or marker-pink (mystery/content) language so all three read as an at-a-glance color
    system. Must stay flat/flush — floor marker, never a blocker, even though the bone-stake
    concept implies verticality; keep actual mesh height low and silhouette readable from above.

model:
  generator: meshy
  source: text_to_3d
  target_polycount: 16000
  scale_meters: 2.4
  footprint_note: fits within a single gameplay tile per ASSET_SCALE_GUIDE.md outpost marker sizing
  export: glb

placement:
  pivot: tile_center_at_top_surface
  height_offset: 0.02
