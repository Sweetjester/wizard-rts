  # ---------------------------------------------------------------------------
  # AUTHORED CORRECTION, added 2026-09-04. The original fortress_gatehouse_01 is
  # left byte-for-byte intact above; this is a separate id, not a repair of it.
  #
  # Why it exists: the pack's own test cases B (infantry climbs to the wall-walk
  # using stairs) and E (climber uses a climb point) cannot pass against the
  # original data, because every vertical link's BOTTOM endpoint sits in a cell
  # no nav region declares. left_stair starts at (3,0,8), which is inside the
  # solid block x[3,8] y[0,3] z[5,9]. The gatehouse also has no ground-level nav
  # region at all, and its gate passage dead-ends into that same solid block
  # rather than running through the structure.
  #
  # Rather than invent a rule like "link endpoints are implicitly walkable" --
  # which would be exactly the inferred navigation the spec forbids -- the fix is
  # authored where authoring belongs: the passage is carved the full depth, and a
  # ground floor is declared for the stair bottoms to stand on.
  fortress_gatehouse_02_walkable:
    display_name: "Fortress Gatehouse (walkable test copy)"
    dimensions: [12, 9, 10]
    purpose: [map_choke, defensive_landmark, test_case]
    blocks:
      - {region: {x: [0,2], y: [0,7], z: [3,9]}, material: STONE_BRICK, nav: SOLID}
      - {region: {x: [9,11], y: [0,7], z: [3,9]}, material: STONE_BRICK, nav: SOLID}
      - {region: {x: [3,8], y: [4,5], z: [6,9]}, material: STONE_BRICK, nav: SOLID}
      - {region: {x: [3,8], y: [0,3], z: [5,9]}, material: STONE_BRICK, nav: SOLID}
      # Carved the full depth so the gate actually leads somewhere, and wide
      # enough (x 3..8) that a 2x2 heavy fits through it.
      - {region: {x: [3,8], y: [0,3], z: [0,9]}, material: VOID_DECOR, nav: FLOOR}
    nav_regions:
      - id: gate_passage
        type: GATE
        region: {x: [3,8], y: 0, z: [0,2]}
        clearance: {width: 6, height: 4}
        allowed: [infantry, archer, climber, heavy]
        state_key: gate_open
      - id: inner_floor
        type: FLOOR
        region: {x: [3,8], y: 0, z: [3,9]}
        allowed: [infantry, archer, climber, heavy]
      - id: wall_walk
        type: WALL_WALK
        region: {x: [2,9], y: 6, z: [6,8]}
        allowed: [infantry, archer, climber]
      - id: left_tower_roof
        type: FLOOR
        region: {x: [0,2], y: 8, z: [5,8]}
        allowed: [infantry, archer, climber]
      - id: right_tower_roof
        type: FLOOR
        region: {x: [9,11], y: 8, z: [5,8]}
        allowed: [infantry, archer, climber]
    links:
      - {id: left_stair, type: STAIR, from: [3,0,8], to: [3,6,8], width: 1, allowed: [infantry, archer, climber]}
      - {id: right_stair, type: STAIR, from: [8,0,8], to: [8,6,8], width: 1, allowed: [infantry, archer, climber]}
      - {id: left_tower_climb, type: CLIMB_POINT, from: [3,0,6], to: [2,8,6], allowed: [climber]}
    sockets:
      - {id: road_south, type: BRIDGE_SOCKET, position: [5,0,0], facing: south, width: 4}
      - {id: road_north, type: BRIDGE_SOCKET, position: [5,0,9], facing: north, width: 4}
