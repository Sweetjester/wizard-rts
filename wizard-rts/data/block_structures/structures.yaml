schema_version: "1.0"

world:
  block_size_m: 1.0
  axes:
    x: east_west
    y: vertical
    z: north_south
  origin_rule: "Structure local origin is minimum x,y,z corner."
  coordinate_rule: "All ranges are inclusive."
  navigation_rule: "Never derive traversability from rendered geometry. Use authored nav regions and links."
  visual_rule: "Geometry, collision and navigation are separate systems."
  default_clearance:
    infantry: {width: 1, depth: 1, height: 2}
    archer: {width: 1, depth: 1, height: 2}
    climber: {width: 1, depth: 1, height: 2}
    heavy: {width: 2, depth: 2, height: 3}
    siege: {width: 3, depth: 3, height: 4}
    flying: {width: 1, depth: 1, height: 1}

unit_classes:
  infantry:
    footprint: [1, 1]
    can_use_floor: true
    can_use_stairs: true
    can_use_ramps: true
    can_use_ladders: false
    can_use_climb_points: false
    can_use_portals: true
    can_pass_open_gates: true
    max_drop_blocks: 1

  archer:
    inherits: infantry

  climber:
    footprint: [1, 1]
    can_use_floor: true
    can_use_stairs: true
    can_use_ramps: true
    can_use_ladders: true
    can_use_climb_points: true
    can_use_portals: true
    can_pass_open_gates: true
    max_drop_blocks: 2

  heavy:
    footprint: [2, 2]
    can_use_floor: true
    can_use_stairs: false
    can_use_ramps: true
    can_use_ladders: false
    can_use_climb_points: false
    can_use_portals: false
    can_pass_open_gates: true
    max_drop_blocks: 0

  siege:
    footprint: [3, 3]
    can_use_floor: true
    can_use_stairs: false
    can_use_ramps: true
    can_use_ladders: false
    can_use_climb_points: false
    can_use_portals: false
    can_pass_open_gates: true
    max_drop_blocks: 0

  flying:
    ignores_ground_navigation: true

nav_types:
  SOLID:
    walkable: false
  FLOOR:
    walkable: true
  WALL_WALK:
    walkable: true
  STAIR:
    walkable: true
    elevation_link: true
  RAMP:
    walkable: true
    elevation_link: true
  GATE:
    conditional_walkable: true
  LADDER:
    walkable: false
    link_only: true
  CLIMB_POINT:
    walkable: false
    link_only: true
  PORTAL:
    walkable: false
    link_only: true
  DROP_EDGE:
    walkable: true
    one_way_down: true
  BRIDGE_SOCKET:
    walkable: false
    generation_socket: true

materials:
  STONE_BRICK: {collision: solid}
  MOSSY_STONE: {collision: solid}
  BLACK_STONE: {collision: solid}
  TIMBER: {collision: solid}
  BONE: {collision: solid}
  METAL_GATE: {collision: conditional}
  RUIN_STONE: {collision: solid}
  MAGIC_STONE: {collision: solid}
  VOID_DECOR: {collision: none}

structures:

  fortress_gatehouse_01:
    display_name: "Fortress Gatehouse"
    dimensions: [12, 8, 10]
    purpose: [map_choke, defensive_landmark, capturable_structure]
    blocks:
      - {region: {x: [0,2], y: [0,7], z: [3,9]}, material: STONE_BRICK, nav: SOLID}
      - {region: {x: [9,11], y: [0,7], z: [3,9]}, material: STONE_BRICK, nav: SOLID}
      - {region: {x: [3,8], y: [4,5], z: [6,9]}, material: STONE_BRICK, nav: SOLID}
      - {region: {x: [3,8], y: [0,3], z: [5,9]}, material: STONE_BRICK, nav: SOLID}
      - {region: {x: [4,7], y: [0,3], z: [0,5]}, material: VOID_DECOR, nav: FLOOR}
    nav_regions:
      - id: gate_passage
        type: GATE
        region: {x: [4,7], y: 0, z: [0,5]}
        clearance: {width: 4, height: 4}
        allowed: [infantry, archer, climber, heavy]
        state_key: gate_open
      - id: wall_walk
        type: WALL_WALK
        region: {x: [2,9], y: 6, z: [6,8]}
        allowed: [infantry, archer, climber]
      - id: left_tower_roof
        type: FLOOR
        region: {x: [0,2], y: 8, z: [5,8]}
        allowed: [infantry, archer, climber]
      - id: right_tower_roof
        type: FLOOR
        region: {x: [9,11], y: 8, z: [5,8]}
        allowed: [infantry, archer, climber]
    links:
      - {id: left_stair, type: STAIR, from: [3,0,8], to: [3,6,8], width: 1, allowed: [infantry, archer, climber]}
      - {id: right_stair, type: STAIR, from: [8,0,8], to: [8,6,8], width: 1, allowed: [infantry, archer, climber]}
    sockets:
      - {id: road_south, type: BRIDGE_SOCKET, position: [5,0,0], facing: south, width: 4}
      - {id: road_north, type: BRIDGE_SOCKET, position: [5,0,9], facing: north, width: 4}

