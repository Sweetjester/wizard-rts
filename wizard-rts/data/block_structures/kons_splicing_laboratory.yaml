    summary: >
      A gothic barracks laboratory with a broad muster entrance, two specimen
      islands, a six-block central operating aisle, U-shaped upper gallery,
      rear splicing chamber, glazed clerestory and two asymmetric exhaust towers.
      Units enter and circulate through authored routes; visual dressing never
      creates navigation or changes training rules.
