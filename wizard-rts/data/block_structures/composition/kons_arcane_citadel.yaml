debug_expectations:
  visual_readability:
    - Castle reads as a 96x96 square fortress from top-down view.
    - Four corners have distinct tower silhouettes and roles.
    - The existing observation tower instance remains recognizable at full scale.
    - The south gatehouse is the obvious primary entrance.
    - Central keep is visually dominant and centered without filling the whole courtyard.
    - Wall-walks form a readable elevated route around most of the perimeter.
    - Bridges from wall-walks to the keep are visually clear and not confused with ground paths.
  navigation_overlay:
    - Visual block volumes can be toggled off while nav regions remain inspectable.
    - Ground nav, wall-walk nav, keep nav, and flying volume nav use separate debug colors.
    - Gate traversal links visibly change between blocked and passable when gate state changes.
    - Heavy unit nav overlay excludes stairs and wall-walks.
    - Flying unit nav overlay is a volume, not a flat floor polygon.
  socket_debugging:
    - Every socket renders an id label in editor debug mode.
    - Compatible sockets share color by connection type.
    - Unmatched required sockets report validation warnings.
    - Socket positions outside build bounds are allowed only for exterior road stubs.

validation_tests:
  static_structure_tests:
    - id: dimensions_match_expected_mega_structure
      assert:
        dimensions.size: [96, 46, 96]

    - id: existing_observation_tower_is_instanced_once
      assert:
        instances_contains_prefab: kons_observation_wizard_tower_01
        min_count: 1

    - id: four_corner_tower_roles_exist
      assert:
        required_instance_ids:
          - north_west_existing_observation_tower
          - north_east_astrolabe_tower
          - south_west_archive_tower
          - south_east_gatewatch_tower

    - id: nav_is_not_derived_implicitly_from_visuals
      assert:
        nav_regions.authored_separately_from_visual_blocks: true

    - id: all_gates_have_nav_links
      assert:
        every_gate_has_nav_link_id: true

    - id: all_wall_walk_bridges_have_socket_pairs
      assert:
        traversal_link_types_require_socket_pair:
          - bridge

  pathing_tests:
    - id: infantry_can_enter_keep_from_exterior
      agent: infantry
      start_socket: main_gate_road
      goal_socket: keep_south_entry_socket
      expected_result: reachable_when_main_south_gate_open

    - id: archer_can_reach_wall_walk_and_keep_roof
      agent: archer
      start_socket: main_gate_road
      goal_socket: keep_roof_socket
      expected_result: reachable_via_gatehouse_ramp_wall_walk_bridge_and_keep_stairs

    - id: climber_can_use_marked_vertical_routes
      agent: climber
      start_socket: inner_court_sw_path_socket
      goal_socket: keep_roof_socket
      expected_result: reachable_without_heavy_clearance

    - id: heavy_can_reach_keep_plinth_but_not_wall_walk
      agent: heavy
      start_socket: main_gate_road
      goal_region: keep_plinth_ring_nav
      expected_result: reachable_when_main_south_gate_open
      negative_goal_region: wall_walk_outer_ring_nav
      expected_negative_result: unreachable

    - id: flying_can_reach_roofs_without_using_gates
      agent: flying
      start_region: flying_volume_nav
      goal_socket: keep_roof_socket
      expected_result: reachable_independent_of_gate_state

    - id: closed_main_gate_blocks_ground_entry
      agent: infantry
      start_socket: main_gate_road
      goal_region: south_courtyard_nav
      gate_states:
        main_south_gate: closed
      expected_result: unreachable

    - id: open_main_gate_allows_ground_entry
      agent: infantry
      start_socket: main_gate_road
      goal_region: south_courtyard_nav
      gate_states:
        main_south_gate: open
      expected_result: reachable

implementation_notes_for_claude:
  - Treat this file as a composition spec, not a single mesh recipe.
  - Build visual block volumes first, then build nav regions from nav_regions and traversal_links.
  - Do not infer navigation from the visual blocks except where a nav region explicitly says generated_from_visual_ids.
  - Prefab sockets should be transformed by instance origin and rotation before validation.
  - Wall segment generation should create body, deck, and crenellation blocks from repeated_wall_segments defaults.
  - Gate state should affect traversal links only, not delete authored nav regions.
  - Keep heavy-unit routing intentionally restricted to the main gate, broad courtyards, and keep plinth ramps.
