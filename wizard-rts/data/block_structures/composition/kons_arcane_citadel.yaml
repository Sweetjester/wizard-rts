nav_regions:
  authored_separately_from_visual_blocks: true
  units:
    walkable_clearance_height_blocks: 3
    heavy_clearance_width_blocks: 3
  regions:
    - id: exterior_main_road_nav
      agent_classes: [infantry, archer, heavy]
      plane_y: 2
      polygon:
        - [42, 2, -12]
        - [54, 2, -12]
        - [54, 2, 0]
        - [42, 2, 0]

    - id: main_gate_tunnel_nav
      agent_classes: [infantry, archer, heavy]
      plane_y: 2
      polygon:
        - [44, 2, 0]
        - [52, 2, 0]
        - [52, 2, 18]
        - [44, 2, 18]

    - id: south_courtyard_nav
      agent_classes: [infantry, archer, climber, heavy]
      plane_y: 2
      polygon:
        - [24, 2, 18]
        - [72, 2, 18]
        - [72, 2, 31]
        - [24, 2, 31]

    - id: north_courtyard_nav
      agent_classes: [infantry, archer, climber, heavy]
      plane_y: 2
      polygon:
        - [24, 2, 67]
        - [72, 2, 67]
        - [72, 2, 78]
        - [24, 2, 78]

    - id: west_courtyard_nav
      agent_classes: [infantry, archer, climber]
      plane_y: 2
      polygon:
        - [18, 2, 24]
        - [31, 2, 24]
        - [31, 2, 72]
        - [18, 2, 72]

    - id: east_courtyard_nav
      agent_classes: [infantry, archer, climber]
      plane_y: 2
      polygon:
        - [65, 2, 24]
        - [78, 2, 24]
        - [78, 2, 72]
        - [65, 2, 72]

    - id: keep_plinth_ring_nav
      agent_classes: [infantry, archer, climber, heavy]
      plane_y: 5
      polygon:
        - [27, 5, 27]
        - [69, 5, 27]
        - [69, 5, 69]
        - [27, 5, 69]
      holes:
        - - [31, 5, 31]
          - [65, 5, 31]
          - [65, 5, 65]
          - [31, 5, 65]

    - id: keep_ground_floor_nav
      agent_classes: [infantry, archer, climber]
      plane_y: 5
      polygon:
        - [33, 5, 33]
        - [63, 5, 33]
        - [63, 5, 63]
        - [33, 5, 63]

    - id: wall_walk_outer_ring_nav
      agent_classes: [infantry, archer, climber]
      plane_y: 18
      segments:
        - [north_wall_walk_deck]
        - [west_wall_walk_deck]
        - [east_wall_walk_deck]
        - [south_wall_walk_deck_west]
        - [south_wall_walk_deck_east]
        - [gatehouse_top_walk]

    - id: keep_bridge_nav
      agent_classes: [infantry, archer, climber]
      plane_y: 18
      segments:
        - [north_keep_bridge]
        - [west_keep_bridge]
        - [east_keep_bridge]

    # Split into one region per tier, 2026-09-04. As a single region spanning
    # levels 24, 32 and 40 it was three disconnected horizontal planes sharing a
    # name: every link into it landed on level 24, so 424 cells of upper keep
    # and roof were unreachable while reporting as one "reachable" region.
    # Separate regions make each tier something a link can actually name.
    #
    # plane_y 15 is dropped: no block in the list has its top surface there.
    - id: keep_upper_nav
      agent_classes: [infantry, archer, climber]
      plane_y_levels: [24]
      generated_from_visual_ids:
        - keep_second_tier

    - id: keep_tier3_nav
      agent_classes: [infantry, archer, climber]
      plane_y_levels: [32]
      generated_from_visual_ids:
        - keep_third_tier

    - id: keep_observatory_nav
      agent_classes: [infantry, archer, climber]
      plane_y_levels: [40]
      generated_from_visual_ids:
        - keep_roof_observatory

    - id: flying_volume_nav
      agent_classes: [flying]
      volume:
        origin: [0, 4, 0]
        size: [96, 42, 96]
      avoid_solid_visual_blocks: true

traversal_links:
  links:
    - id: main_gate_passage_link
      type: gate_passage
      agent_classes: [infantry, archer, heavy]
      from: exterior_main_road_nav
      to: south_courtyard_nav
      through_gate: main_south_gate
      width_blocks: 8
      requires_gate_open: true

    - id: north_service_gate_link
      type: gate_passage
      agent_classes: [infantry, archer]
      from: north_courtyard_nav
      to: north_exterior_service_stub
      through_gate: north_service_gate
      width_blocks: 6
      requires_gate_open: true

    - id: south_ramp_link
      type: ramp
      agent_classes: [infantry, archer, climber, heavy]
      from: south_courtyard_nav
      to: keep_plinth_ring_nav
      visual_id: south_courtyard_to_keep_plinth_ramp

    - id: north_ramp_link
      type: ramp
      agent_classes: [infantry, archer, climber, heavy]
      from: north_courtyard_nav
      to: keep_plinth_ring_nav
      visual_id: north_courtyard_to_keep_plinth_ramp

    - id: west_ramp_link
      type: ramp
      agent_classes: [infantry, archer, climber]
      from: west_courtyard_nav
      to: keep_plinth_ring_nav
      visual_id: west_courtyard_to_keep_plinth_ramp

    - id: east_ramp_link
      type: ramp
      agent_classes: [infantry, archer, climber]
      from: east_courtyard_nav
      to: keep_plinth_ring_nav
      visual_id: east_courtyard_to_keep_plinth_ramp

    - id: west_wall_walk_ramp_link
      type: ramp
      agent_classes: [infantry, archer, climber]
      from: south_courtyard_nav
      to: wall_walk_outer_ring_nav
      visual_id: gatehouse_to_wall_walk_west_ramp

    - id: east_wall_walk_ramp_link
      type: ramp
      agent_classes: [infantry, archer, climber]
      from: south_courtyard_nav
      to: wall_walk_outer_ring_nav
      visual_id: gatehouse_to_wall_walk_east_ramp

    # Added 2026-09-04. The keep declares four arches and four entry sockets but
    # no traversal link through any of them, so its ground floor, its upper
    # floors and all three wall-walk bridges were sealed: reachable geometry
    # around a completely unreachable interior. Each link is anchored to the
    # arch it passes through.
    - id: keep_south_entry_link
      type: ramp
      agent_classes: [infantry, archer, climber]
      from: keep_plinth_ring_nav
      to: keep_ground_floor_nav
      visual_id: keep_south_arch

    - id: keep_north_entry_link
      type: ramp
      agent_classes: [infantry, archer, climber]
      from: keep_plinth_ring_nav
      to: keep_ground_floor_nav
      visual_id: keep_north_arch

    - id: keep_west_entry_link
      type: ramp
      agent_classes: [infantry, archer, climber]
      from: keep_plinth_ring_nav
      to: keep_ground_floor_nav
      visual_id: keep_west_arch

    - id: keep_east_entry_link
      type: ramp
      agent_classes: [infantry, archer, climber]
      from: keep_plinth_ring_nav
      to: keep_ground_floor_nav
      visual_id: keep_east_arch

    - id: keep_internal_stair_link
      type: stair
      agent_classes: [infantry, archer, climber]
      from: keep_ground_floor_nav
      to: keep_upper_nav
      visual_id: keep_internal_spiral_stair_placeholder

    # Was keep_upper_nav -> keep_roof_socket, naming a SOCKET as its destination
    # where every other link names a region, so it resolved to nothing and the
    # roof was sealed. Now two links, one per tier the stairs actually serve.
    - id: keep_tier2_to_tier3_link
      type: stair
      agent_classes: [infantry, archer, climber]
      from: keep_upper_nav
      to: keep_tier3_nav
      visual_id: keep_internal_spiral_stair_placeholder

    - id: keep_roof_stair_link
      type: stair
      agent_classes: [infantry, archer, climber]
      from: keep_tier3_nav
      to: keep_observatory_nav
      visual_id: keep_roof_stair_placeholder

    - id: north_keep_bridge_link
      type: bridge
      agent_classes: [infantry, archer, climber]
      from: wall_walk_outer_ring_nav
      to: keep_upper_nav
      socket_pair: [north_keep_bridge_socket, keep_wall_walk_north_socket]

    - id: west_keep_bridge_link
      type: bridge
      agent_classes: [infantry, archer, climber]
      from: wall_walk_outer_ring_nav
      to: keep_upper_nav
      socket_pair: [west_keep_bridge_socket, keep_wall_walk_west_socket]

    - id: east_keep_bridge_link
      type: bridge
      agent_classes: [infantry, archer, climber]
      from: wall_walk_outer_ring_nav
      to: keep_upper_nav
      socket_pair: [east_keep_bridge_socket, keep_wall_walk_east_socket]

    - id: flying_volume_link
      type: free_volume
      agent_classes: [flying]
      from: flying_volume_nav
      to: all_exposed_roof_and_courtyard_regions
      ignores_gates: true

