id: kons_arcane_citadel_01
name: "Kon's Arcane Citadel"
schema_version: 1
intent:
  summary: >
    A very large square wizard castle mega-structure for YAML-driven block
    construction in a Godot RTS. Visual construction, authored navigation,
    traversal links, gates, ramps, and procedural connection sockets are kept
    explicit and practical for implementation.
  includes:
    - YAML-driven building generation
    - large block-based structure construction
    - architectural readability
    - pathing
    - stairs
    - ramps
    - gates
    - wall_walks
    - procedural_connection_sockets
  excludes:
    - combat
    - line_of_sight
    - cover
    - destruction
    - ranged_systems

dimensions:
  units: blocks
  size: [96, 46, 96]
  axes:
    x: east_west
    y: vertical
    z: north_south
  origin:
    mode: south_west_ground_corner
    coordinate: [0, 0, 0]
  build_bounds:
    min: [0, 0, 0]
    max: [95, 45, 95]

placement:
  footprint:
    shape: square
    size: [96, 96]
    anchor: center
    ground_contact_y: 0
  clearance:
    horizontal_margin_blocks: 6
    vertical_margin_blocks: 4
  terrain_requirements:
    preferred: flat_or_terraced
    max_allowed_slope_blocks: 2
    foundation_autofill: true
  rotation:
    allowed_y_degrees: [0, 90, 180, 270]
  snapping:
    grid_size: 1
    socket_snap_priority:
      - main_gate_road
      - service_gate_road
      - wall_walk_bridge
      - courtyard_path

materials:
  palette:
    foundation: dark_basalt_block
    exterior_wall: pale_arcane_stone_block
    exterior_trim: blue_slate_block
    interior_floor: worn_limestone_block
    keep_wall: silver_granite_block
    tower_wall: pale_arcane_stone_block
    roof: deep_cobalt_roof_block
    stair: pale_arcane_stone_stair
    ramp: pale_arcane_stone_ramp
    gate: reinforced_oak_gate
    arch: carved_arcane_arch_block
    crystal: blue_mana_crystal_block
    glass: lit_arcane_glass_block
    marker: debug_marker_block
  material_roles_are_visual_only: true

generation:
  composition_model: prefab_instances_plus_block_volumes
  visual_layers:
    - foundations
    - curtain_walls
    - towers
    - gatehouse
    - wall_walks
    - central_keep
    - ramps_and_stairs
    - courtyard_features
    - rooflines
    - decorative_readability_markers
  navigation_is_authored_separately_from_visuals: true
  block_volume_format:
    origin: [x, y, z]
    size: [x, y, z]
    material: material_role_or_block_id
  prefab_instance_format:
    prefab: prefab_id
    origin: [x, y, z]
    rotation_y: degrees
    sockets:
      expose: true

instances:
  - id: north_west_existing_observation_tower
    prefab: kons_observation_wizard_tower_01
    role: existing_scale_reference_and_corner_observatory
    # y raised 0 -> 2 on 2026-09-04. The citadel's full_citadel_slab occupies
    # y0-y1 and every courtyard sits at y2, so a tower instanced at y0 had its
    # entrance apron buried inside the foundation and two levels below the
    # ground everything else walks on. It was unreachable from anywhere.
    origin: [4, 2, 74]
    rotation_y: 0
    footprint: [18, 18]
    expected_height: 32
    connect_to:
      - west_wall_walk_north_socket
      - north_wall_walk_west_socket
      - inner_court_nw_path_socket

  - id: north_east_astrolabe_tower
    prefab: citadel_astrolabe_corner_tower_01
    role: celestial_readability_landmark
    origin: [74, 0, 74]
    rotation_y: 90
    footprint: [18, 18]
    expected_height: 42
    connect_to:
      - north_wall_walk_east_socket
      - east_wall_walk_north_socket
      - inner_court_ne_path_socket

  - id: south_west_archive_tower
    prefab: citadel_archive_corner_tower_01
    role: heavy_square_library_tower
    origin: [4, 0, 4]
    rotation_y: 270
    footprint: [18, 18]
    expected_height: 36
    connect_to:
      - west_wall_walk_south_socket
      - south_wall_walk_west_socket
      - inner_court_sw_path_socket

  - id: south_east_gatewatch_tower
    prefab: citadel_gatewatch_corner_tower_01
    role: stair_and_gate_orientation_tower
    origin: [74, 0, 4]
    rotation_y: 180
    footprint: [18, 18]
    expected_height: 38
    connect_to:
      - east_wall_walk_south_socket
      - south_wall_walk_east_socket
      - inner_court_se_path_socket

substructures:
  prefab_contracts:
    - prefab: kons_observation_wizard_tower_01
      expected_sockets:
        - id: ground_entry
          type: path
          local_position: [9, 0, 0]
        - id: wall_walk_left
          type: wall_walk
          local_position: [0, 18, 9]
        - id: wall_walk_right
          type: wall_walk
          local_position: [17, 18, 9]
        - id: roof_access
          type: vertical_route
          local_position: [9, 31, 9]

    - prefab: citadel_astrolabe_corner_tower_01
      size: [18, 42, 18]
      windows:
        - {id: astrolabe, origin: [3, 26, 3], size: [12, 4, 12], every: 4, width: 2, material: glass}
      visual_blocks:
        - id: astrolabe_tower_base
          origin: [0, 0, 0]
          size: [18, 18, 18]
          material: tower_wall
        - id: astrolabe_tower_upper_core
          origin: [3, 18, 3]
          size: [12, 16, 12]
          material: tower_wall
        - id: astrolabe_ring_platform
          origin: [1, 34, 1]
          size: [16, 2, 16]
          material: exterior_trim
        - id: astrolabe_roof_cap
          origin: [4, 36, 4]
          size: [10, 6, 10]
          material: roof
        # The lantern itself. Glazed through, like the observation tower's crown,
        # because a corner tower's job at this scale is to be findable at night.
        - {id: astrolabe_lantern, origin: [4, 37, 4], size: [10, 4, 10], material: glass}
      sockets:
        - { id: ground_entry, type: path, local_position: [9, 0, 0], direction: south }
        - { id: wall_walk_left, type: wall_walk, local_position: [0, 18, 9], direction: west }
        - { id: wall_walk_right, type: wall_walk, local_position: [17, 18, 9], direction: east }
        - { id: roof_access, type: vertical_route, local_position: [9, 35, 9], direction: up }

    - prefab: citadel_archive_corner_tower_01
      size: [18, 36, 18]
      windows:
        - {id: archive, origin: [2, 22, 2], size: [14, 4, 14], every: 4, width: 2, material: glass}
      visual_blocks:
        - id: archive_tower_base
          origin: [0, 0, 0]
          size: [18, 16, 18]
          material: tower_wall
        - id: archive_inner_stack
          origin: [2, 16, 2]
          size: [14, 14, 14]
          material: keep_wall
        - id: archive_flat_roof
          origin: [1, 30, 1]
          size: [16, 2, 16]
          material: exterior_trim
        - id: archive_roof_beacon
          origin: [7, 32, 7]
          size: [4, 4, 4]
          material: crystal
      sockets:
        - { id: ground_entry, type: path, local_position: [9, 0, 17], direction: north }
        - { id: wall_walk_left, type: wall_walk, local_position: [0, 18, 9], direction: west }
        - { id: wall_walk_right, type: wall_walk, local_position: [17, 18, 9], direction: east }
        - { id: archive_service_stair, type: vertical_route, local_position: [4, 0, 4], direction: up }

    - prefab: citadel_gatewatch_corner_tower_01
      size: [18, 38, 18]
      windows:
        - {id: gatewatch, origin: [4, 24, 4], size: [10, 4, 10], every: 4, width: 2, material: glass}
      visual_blocks:
        - id: gatewatch_tower_base
          origin: [0, 0, 0]
          size: [18, 18, 18]
          material: tower_wall
        - id: gatewatch_tall_core
          origin: [4, 18, 4]
          size: [10, 14, 10]
          material: tower_wall
        - id: gatewatch_roof
          origin: [3, 32, 3]
          size: [12, 6, 12]
          material: roof
        # Glazed watch room. This tower faces the gate, so it is the one the
        # player looks at on approach.
        - {id: gatewatch_lantern, origin: [3, 33, 3], size: [12, 3, 12], material: glass}
      sockets:
        - { id: ground_entry, type: path, local_position: [0, 0, 9], direction: west }
        - { id: wall_walk_left, type: wall_walk, local_position: [0, 18, 9], direction: west }
        - { id: wall_walk_right, type: wall_walk, local_position: [17, 18, 9], direction: east }
        - { id: gatehouse_bridge, type: wall_walk, local_position: [9, 18, 0], direction: south }

# Punctuated window rows, one entry per lit mass. The adapter walks the four
# faces of each box and places `width`-wide openings every `every` blocks,
# leaving the corners as stone. Authored this way rather than block by block
# because a continuous glass band reads as a glowing slab; the rhythm of narrow
# openings with masonry between them is what makes a facade read as a building.
windows:
  - {id: keep_tier2, origin: [35, 19, 35], size: [26, 3, 26], every: 5, width: 2, material: glass}
  - {id: keep_tier3, origin: [39, 27, 39], size: [18, 3, 18], every: 5, width: 2, material: glass}
  - {id: gatehouse_west, origin: [38, 10, 4], size: [6, 4, 14], every: 5, width: 2, material: glass}
  - {id: gatehouse_east, origin: [52, 10, 4], size: [6, 4, 14], every: 5, width: 2, material: glass}

foundations:
  visual_blocks:
    - id: full_citadel_slab
      origin: [0, 0, 0]
      size: [96, 2, 96]
      material: foundation
    - id: raised_keep_plinth
      origin: [29, 2, 29]
      size: [38, 3, 38]
      material: foundation
    - id: south_gate_approach_plinth
      origin: [38, 2, 0]
      size: [20, 2, 18]
      material: foundation
    - id: north_service_plinth
      origin: [42, 2, 78]
      size: [12, 2, 18]
      material: foundation

repeated_wall_segments:
