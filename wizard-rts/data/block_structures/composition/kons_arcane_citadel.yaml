      origin: [22, 2, 86]
      length: 26
      thickness_axis: z
      material: exterior_wall
      sockets:
        west: north_wall_walk_west_socket
        east: north_keep_bridge_socket

    - id: north_curtain_wall_east_run
      orientation: east_west
      origin: [48, 2, 86]
      length: 26
      thickness_axis: z
      material: exterior_wall
      sockets:
        west: north_keep_bridge_socket
        east: north_wall_walk_east_socket

    - id: south_curtain_wall_west_run
      orientation: east_west
      origin: [22, 2, 4]
      length: 16
      thickness_axis: z
      material: exterior_wall
      sockets:
        west: south_wall_walk_west_socket
        east: gatehouse_west_wall_walk_socket

    - id: south_curtain_wall_east_run
      orientation: east_west
      origin: [58, 2, 4]
      length: 16
      thickness_axis: z
      material: exterior_wall
      sockets:
        west: gatehouse_east_wall_walk_socket
        east: south_wall_walk_east_socket

    - id: west_curtain_wall_south_run
      orientation: north_south
      origin: [4, 2, 22]
      length: 26
      thickness_axis: x
      material: exterior_wall
      sockets:
        south: west_wall_walk_south_socket
        north: west_keep_bridge_socket

    - id: west_curtain_wall_north_run
      orientation: north_south
      origin: [4, 2, 48]
      length: 26
      thickness_axis: x
      material: exterior_wall
      sockets:
        south: west_keep_bridge_socket
        north: west_wall_walk_north_socket

    - id: east_curtain_wall_south_run
      orientation: north_south
      origin: [86, 2, 22]
      length: 26
      thickness_axis: x
      material: exterior_wall
      sockets:
        south: east_wall_walk_south_socket
        north: east_keep_bridge_socket

    - id: east_curtain_wall_north_run
      orientation: north_south
      origin: [86, 2, 48]
      length: 26
      thickness_axis: x
      material: exterior_wall
      sockets:
        south: east_keep_bridge_socket
        north: east_wall_walk_north_socket
  generated_features:
    wall_body:
      size_rules:
        east_west: [length, 18, 6]
        north_south: [6, 18, length]
    wall_walk:
      y: 18
      material: exterior_trim
      width: 4
      centered_on_wall: true
    crenellation:
      y: 20
      material: exterior_trim
      block_size: [2, 2, 2]
      every_blocks: 4
      leave_open_notches: true

wall_walks:
  authored_visual_decks:
    - id: north_wall_walk_deck
      origin: [22, 18, 87]
      size: [52, 1, 4]
      material: exterior_trim
    - id: south_wall_walk_deck_west
      origin: [22, 18, 5]
      size: [16, 1, 4]
      material: exterior_trim
    - id: south_wall_walk_deck_east
      origin: [58, 18, 5]
      size: [16, 1, 4]
      material: exterior_trim
    - id: west_wall_walk_deck
      origin: [5, 18, 22]
      size: [4, 1, 52]
      material: exterior_trim
    - id: east_wall_walk_deck
      origin: [87, 18, 22]
