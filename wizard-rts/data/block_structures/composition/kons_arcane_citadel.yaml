central_keep:
  id: central_arcane_keep
  role: readable_square_inner_castle_and_primary_vertical_mass
  footprint:
    origin: [31, 5, 31]
    size: [34, 34]
  visual_blocks:
    - id: keep_ground_hall
      origin: [31, 5, 31]
      size: [34, 10, 34]
      material: keep_wall
    - id: keep_second_tier
      origin: [35, 15, 35]
      size: [26, 9, 26]
      material: keep_wall
    - id: keep_third_tier
      origin: [39, 24, 39]
      size: [18, 8, 18]
      material: keep_wall
    - id: keep_roof_observatory
      origin: [43, 32, 43]
      size: [10, 8, 10]
      material: tower_wall
    - id: keep_roof_cap
      origin: [41, 40, 41]
      size: [14, 5, 14]
      material: roof
    # The roof observatory is called an observatory, so it is glazed through
    # rather than given a window band. It is the highest lit mass on the map and
    # the thing a player navigates by.
    #
    # Deliberately does NOT change keep_roof_observatory's own extents: that
    # block is what keep_observatory_nav generates its floor from, and shrinking
    # it would quietly delete the roof a captured citadel is walked onto.
    - {id: keep_observatory_glass, origin: [43, 34, 43], size: [10, 5, 10], material: glass}

    - id: keep_north_arch
      origin: [44, 5, 65]
      size: [8, 8, 2]
      material: arch
    - id: keep_south_arch
      origin: [44, 5, 29]
      size: [8, 8, 2]
      material: arch
    - id: keep_west_arch
      origin: [29, 5, 44]
      size: [2, 8, 8]
      material: arch
    - id: keep_east_arch
      origin: [65, 5, 44]
      size: [2, 8, 8]
      material: arch
  readable_silhouette_rules:
    - ground_hall_is_largest_square
    - each_higher_tier_steps_in_by_4_blocks
    - roof_cap_is_visibly_smaller_than_third_tier
    - main_doors_face_four_cardinal_courtyards
  sockets:
    - { id: keep_south_entry_socket, type: path, position: [48, 5, 30], direction: south }
    - { id: keep_north_entry_socket, type: path, position: [48, 5, 66], direction: north }
    - { id: keep_west_entry_socket, type: path, position: [30, 5, 48], direction: west }
    - { id: keep_east_entry_socket, type: path, position: [66, 5, 48], direction: east }
    - { id: keep_roof_socket, type: vertical_route, position: [48, 40, 48], direction: up }
    - { id: keep_wall_walk_north_socket, type: wall_walk, position: [48, 18, 67], direction: north }
    - { id: keep_wall_walk_west_socket, type: wall_walk, position: [29, 18, 48], direction: west }
    - { id: keep_wall_walk_east_socket, type: wall_walk, position: [67, 18, 48], direction: east }

