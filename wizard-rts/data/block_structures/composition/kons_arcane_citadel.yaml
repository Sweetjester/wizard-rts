      open_clearance:
        origin: [45, 2, 86]
        size: [6, 8, 10]
      nav_link_id: north_service_gate_link
      sockets:
        exterior: north_service_gate_exterior_socket
        interior: north_service_gate_interior_socket

procedural_sockets:
  socket_rules:
    coordinates_are_world_local_to_structure_origin: true
    snap_tolerance_blocks: 1
    direction_required: true
    connection_types:
      road:
        compatible_with: [road, courtyard_path]
      courtyard_path:
        compatible_with: [road, path, ramp, gate]
      wall_walk:
        compatible_with: [wall_walk, bridge, vertical_route]
