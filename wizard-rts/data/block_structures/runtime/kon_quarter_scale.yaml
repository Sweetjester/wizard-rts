# Gameplay plans, not a lossy conversion of the full-resolution design masters.
# x/east, y/up, z/north; inclusive ranges. One cell remains one map cell.
# Citadel art uses quarter-cell sub-blocks; lab art is bespoke, in game units.
# The observation tower deliberately has no override: use its original master.
# Dimensions round UP where a quarter cell cannot be represented on this grid.
structures:

